<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Fields</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <div class="card">
        <h2 class="title">Form Fields</h2>
        <form class="form" id="form" novalidate>
          <!-- Name Section -->
          <div class="input-group">
            <label for="name">Name</label>
            <input id="name" type="text" placeholder="Full Name" required />
            <span class="error-msg" id="error-msg"></span>
          </div>
          <!-- Email Section -->
          <div class="input-group">
            <label for="email">Email</label>
            <input
              type="text"
              id="email"
              name="email"
              placeholder="e.g peter@gmail.com"
              required
            />
            <span class="error-msg" id="emailErrorMsg"></span>
          </div>
          <!-- Password Section -->
          <div class="input-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Create a Password"
              required
            />
            <span class="error-msg" id="passwordErrorMsg"></span>
          </div>
          <!-- Confirm Password -->
          <div class="input-group">
            <label for="confirm-password">Confirm Password</label>
            <input
              type="password"
              id="confirm-password"
              name="confirm-password"
              placeholder="Confirm Password"
              required
            />
            <span class="error-msg" id="confirmPasswordErrorMsg"></span>
          </div>
          <!-- Button to Submit -->
          <button type="submit" class="submit-btn" id="submit-btn" disabled>
            Create Account
          </button>
          <span class="submitMsg" id="submitMsg"></span>
        </form>
      </div>
    </div>
    <!-- JavaScript Link -->
    <script src="./script.js"></script>
  </body>
</html>
